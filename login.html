<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Leave Planner</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="src/css/fonts.css">
<link rel="stylesheet" href="src/css/app.css">
<style>
  .signin{min-height:100vh;display:grid;place-items:center;padding:24px}
  .signin .card{width:min(400px,100%)}
  .signin .card:hover{transform:none}
  .signin .brand{justify-content:center;font-size:20px;margin-bottom:4px}
  .signin .brand .dot{width:32px;height:32px;font-size:14px}
</style>
</head>
<body>
<main class="signin">
  <form class="card" id="form" novalidate>
    <div class="card-b" style="display:grid;gap:16px;padding:28px">
      <div>
        <div class="brand"><span class="dot">L</span><span>Leave Planner</span></div>
        <div class="sub" style="text-align:center">Sign in with your employee ID</div>
      </div>
      <label class="f">Employee ID
        <input id="emp" name="empId" autocomplete="username" required autofocus>
      </label>
      <label class="f">Password
        <input id="pw" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="err" class="err" role="alert" hidden></div>
      <button class="btn primary" id="go" type="submit" style="padding:11px">Sign in</button>
      <div class="sub" style="text-align:center;font-size:12px">Forgotten your password? Ask your admin to reset it.</div>
    </div>
  </form>
</main>
<script src="src/js/login.js"></script>
</body>
</html>
