<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Leave Planner</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="src/css/fonts.css">
<link rel="stylesheet" href="src/css/app.css">
<style>
  .signin{min-height:100vh;display:grid;place-items:center;padding:24px}
  .signin .card{width:min(400px,100%)}
  .signin .card:hover{transform:none}
  .signin .brand{justify-content:center;font-size:20px;margin-bottom:4px}
  .signin .brand .dot{width:32px;height:32px;font-size:14px}
  .signin .linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:650;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .signin .linkbtn:disabled{color:var(--muted);cursor:default;text-decoration:none}
  .signin .okmsg{color:var(--ok);background:var(--ok-bg);border-radius:var(--r-xs);padding:9px 11px;font-size:12.5px;font-weight:600}
  .signin .code{font-family:var(--mono, ui-monospace, monospace);font-size:20px;letter-spacing:6px;text-align:center}
</style>
</head>
<body>
<main class="signin">
  <form class="card" id="form" novalidate>
    <div class="card-b" style="display:grid;gap:16px;padding:28px">
      <div>
        <div class="brand"><span class="dot">L</span><span>Leave Planner</span></div>
        <div class="sub" style="text-align:center">Sign in with your employee ID</div>
      </div>
      <label class="f">Employee ID
        <input id="emp" name="empId" autocomplete="username" required autofocus>
      </label>
      <label class="f">Password
        <span class="pw-wrap">
          <input id="pw" name="password" type="password" autocomplete="current-password" required aria-describedby="caps">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path id="pwSlash" d="M4 4l16 16" display="none"></path></svg>
          </button>
        </span>
        <span class="caps" id="caps" role="status" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5l9.5 16.5h-19zM12 10v4.5M12 17.2v.1"></path></svg>
          Caps Lock is on
        </span>
      </label>
      <div id="ok" class="okmsg" role="status" hidden></div>
      <div id="err" class="err" role="alert" hidden></div>
      <button class="btn primary" id="go" type="submit" style="padding:11px">Sign in</button>
      <div class="sub" style="text-align:center;font-size:12px"><button type="button" class="linkbtn" id="forgot">Forgot password?</button></div>
    </div>
  </form>

  <form class="card" id="resetForm" novalidate hidden>
    <div class="card-b" style="display:grid;gap:16px;padding:28px">
      <div>
        <div class="brand"><span class="dot">L</span><span>Leave Planner</span></div>
        <div class="sub" style="text-align:center">Reset your password</div>
      </div>
      <div id="stepId" style="display:grid;gap:16px">
        <div class="sub" style="font-size:12.5px">Enter your employee ID. We'll email a 6-digit code to the address your admin has on file for you.</div>
        <label class="f">Employee ID
          <input id="rEmp" name="empId" autocomplete="username" required>
        </label>
        <button class="btn primary" id="rSend" type="submit" style="padding:11px">Email me a code</button>
      </div>
      <div id="stepCode" style="display:grid;gap:16px" hidden>
        <div id="rSent" class="okmsg" role="status"></div>
        <label class="f">6-digit code
          <input id="rCode" class="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </label>
        <label class="f">New password
          <input id="rPw" name="new-password" type="password" autocomplete="new-password" required>
        </label>
        <label class="f">Type it again
          <input id="rPw2" name="confirm-password" type="password" autocomplete="new-password" required>
        </label>
        <div class="sub" style="font-size:12px">At least 10 characters, not a common password, and not containing your name or employee ID.</div>
        <button class="btn primary" id="rGo" type="submit" style="padding:11px">Set new password</button>
        <div class="sub" style="text-align:center;font-size:12px">No email? Check spam, then <button type="button" class="linkbtn" id="rResend">send a new code</button></div>
      </div>
      <div id="rErr" class="err" role="alert" hidden></div>
      <div class="sub" style="text-align:center;font-size:12px"><button type="button" class="linkbtn" id="rBack">Back to sign in</button></div>
    </div>
  </form>
</main>
<script src="src/js/login.js"></script>
</body>
</html>
