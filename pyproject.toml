[project]
name = "leave-planner"
version = "1.0.0"
description = "Team leave and work-from-home tracker with sign-in and roles"
requires-python = ">=3.12"
# Only needed for the hosted (Postgres) database. Running locally on SQLite
# needs nothing beyond the standard library. Pinned exactly, so every deploy
# installs the version that was tested - change it deliberately.
dependencies = ["psycopg[binary]==3.3.5"]

[tool.vercel]
entrypoint = "server.wsgi:app"
